<!DOCTYPE html>
<html>

<head>

    <title>Add Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>➕ Add Expense</h1>

        <form action="/add" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Expense Title"
                required>

            <input
                type="number"
                step="0.01"
                name="amount"
                placeholder="Amount"
                required>

            <input
                type="text"
                name="category"
                placeholder="Category"
                required>

            <input
                type="date"
                name="date"
                required>

            <button type="submit">
                Save Expense
            </button>

        </form>

        <br>

        <a href="/" class="back-btn">
            ← Back to Home
        </a>

    </div>

</body>

</html>
