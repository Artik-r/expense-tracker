<!DOCTYPE html>
<html>

<head>

    <title>Edit Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>✏️ Edit Expense</h1>

        <form action="/edit/{{ expense['id'] }}" method="POST">

            <input
                type="text"
                name="title"
                value="{{ expense['title'] }}"
                required>

            <input
                type="number"
                step="0.01"
                name="amount"
                value="{{ expense['amount'] }}"
                required>

            <input
                type="text"
                name="category"
                value="{{ expense['category'] }}"
                required>

            <input
                type="date"
                name="date"
                value="{{ expense['date'] }}"
                required>

            <button type="submit">
                Update Expense
            </button>

        </form>

        <br>

        <a href="/" class="back-btn">
            ← Back to Home
        </a>

    </div>

</body>

</html>
