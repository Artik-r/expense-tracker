<!DOCTYPE html>
<html>

<head>

    <title>Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>

        <a href="/add" class="add-btn">
            + Add Expense
        </a>

        <div class="total-box">

            <h2>Total Spending</h2>

            <p>₹ {{ total }}</p>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Title</th>

                    <th>Amount</th>

                    <th>Category</th>

                    <th>Date</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                {% for expense in expenses %}

                <tr>

                    <td>{{ expense["id"] }}</td>

                    <td>{{ expense["title"] }}</td>

                    <td>₹ {{ expense["amount"] }}</td>

                    <td>{{ expense["category"] }}</td>

                    <td>{{ expense["date"] }}</td>

                    <td>

                        <a href="/edit/{{ expense['id'] }}"
                           class="edit-btn">
                            Edit
                        </a>

                        <a href="/delete/{{ expense['id'] }}"
                           class="delete-btn">
                            Delete
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
